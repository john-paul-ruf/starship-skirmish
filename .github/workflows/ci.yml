name: CI

# GitHub Actions CI — architecture §11 (Deployment) + §7.5 row 4 (cross-engine
# determinism).
#
# Every gate that must pass before GitHub Pages can safely serve the built app
# is expressed once in `package.json`:
#
#   - `verify:pages:node`      → typecheck, lint/boundaries, unit tests, catalog
#                                 lock, deterministic Node fixtures, migration
#                                 fixtures, harness purity, production build.
#   - `verify:pages:browsers`  → cross-engine determinism specs (physics,
#                                 assembled combat, and full bot-vs-bot
#                                 harness) executed under Chromium + Firefox +
#                                 WebKit via Playwright projects.
#   - `verify:pages`           → both halves in order (used by the tracked
#                                 pre-push hook so local pushes cannot bypass
#                                 the same set the workflow runs).
#
# This workflow invokes those halves so the local hook and CI cannot drift.
#
# Later features append the remaining architecture §11 jobs:
#
#   TODO(deployment): add the Pages job — actions/upload-pages-artifact +
#     actions/deploy-pages on `main` (§11 step 6). Adding hard remote
#     enforcement of this workflow is a separate GitHub repository-rule change.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    name: verify:pages:node (typecheck / lint / test / build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify Pages readiness (Node half)
        run: npm run verify:pages:node

  cross-engine-determinism:
    # Architecture §7.5 row 4: Chromium + Firefox + WebKit must produce
    # identical digests to the Node golden fixtures. The three specs cover
    # physics scenarios, assembled combat, and the full bot-vs-bot harness.
    # Runs after the Node half so an engine-independent failure surfaces
    # first.
    name: verify:pages:browsers (cross-engine determinism)
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps

      - name: Verify Pages readiness (browser half)
        run: npm run verify:pages:browsers
