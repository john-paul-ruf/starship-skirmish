name: CI

# GitHub Actions CI stub — architecture §11 (Deployment).
#
# This is the minimal pipeline that runs today: typecheck → lint → test:unit → build,
# plus the SESSION-04 additions: test:determinism (Node golden + shuffle + tunneling +
# manifest hash-lock), test:harness-purity (FR-33 structural check), and the
# cross-engine Playwright job that proves the digests match on Chromium + Firefox +
# WebKit (architecture §7.5 row 4).
#
# Later features append the remaining jobs listed in architecture §11 steps 2–6:
#
#   TODO(F2 catalog): add `test:catalog-lock` — fails if any historical ID/ordinal
#     vanished (FR-1, architecture §11 step 2).
#   TODO(F3 io/migrate): add `test:fixtures` — fails if any migration fixture was
#     edited (FR-2, architecture §11 step 3).
#   TODO(deployment): add the Pages job — actions/upload-pages-artifact +
#     actions/deploy-pages on `main` (§11 step 6).

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    name: typecheck / lint / test / build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint (boundaries + determinism ban-list)
        run: npm run lint

      - name: Unit tests
        run: npm run test:unit

      - name: Determinism tests (golden + shuffle + tunneling + manifest hash-lock)
        run: npm run test:determinism

      - name: Harness purity check (FR-33 structural)
        run: npm run test:harness-purity

      - name: Build
        run: npm run build

  cross-engine-determinism:
    # Architecture §7.5 row 4: Chromium + Firefox + WebKit must produce identical
    # digests to the Node golden fixtures. Ships alongside the main build job on the
    # same trigger; if the sim math ever produces engine-different bits, THIS fails.
    name: cross-engine determinism (Playwright)
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps

      - name: Run Playwright determinism spec
        run: npx playwright test tests/e2e/determinism.spec.ts
